<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>A few questions</title>
<style>
  :root {
    --ink: #26251F; --paper: #F2F1EC; --rasp: #A64665; --muted: #8A8578; --line: #DDD9CF; --white: #FFFFFF;
    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body { font-family: var(--sans); -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 32px 24px 150px; }
  .wrap.welcome { padding-top: 64px; }
  h1 { font-family: var(--serif); font-weight: normal; margin: 0; }
  h1.big { font-size: 2.3rem; line-height: 1.15; }
  h1.mid { font-size: 1.9rem; line-height: 1.2; }
  h1.q { font-size: 1.45rem; line-height: 1.35; margin-top: 16px; }
  p { margin: 0; }
  .body-copy p { font-size: 1rem; line-height: 1.6; margin-top: 16px; }
  .muted { color: var(--muted); } .rasp { color: var(--rasp); } .strong { font-weight: 600; }
  .small { font-size: 0.875rem; line-height: 1.55; }
  .mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt20 { margin-top: 20px; }
  .mt32 { margin-top: 32px; } .mt40 { margin-top: 40px; }
  .bar { height: 4px; border-radius: 4px; background: var(--line); }
  .bar > div { height: 4px; border-radius: 4px; background: var(--rasp); transition: width .25s ease; }
  button { font-family: var(--sans); font-size: 1rem; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn { border-radius: 999px; padding: 12px 20px; border: none; background: transparent; color: var(--muted); font-weight: 500; }
  .btn.primary { background: var(--rasp); color: var(--white); font-weight: 600; }
  .btn:focus-visible, .chip:focus-visible, textarea:focus-visible, input:focus-visible, .rev-item:focus-visible {
    outline: 2px solid var(--rasp); outline-offset: 2px;
  }
  textarea, input {
    width: 100%; border: 1px solid var(--line); background: var(--white); color: var(--ink);
    border-radius: 16px; padding: 14px 16px; font-family: var(--sans); font-size: 1rem; line-height: 1.5;
  }
  textarea { min-height: 180px; resize: vertical; }
  textarea.short { min-height: 110px; }
  input { font-size: 1.1rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { border-radius: 999px; padding: 9px 15px; font-size: 0.9rem; font-weight: 500;
    background: var(--white); color: var(--ink); border: 1px solid var(--line); }
  .chips.tight { gap: 6px; }
  .chips.tight .chip { padding: 8px 11px; font-size: 0.84rem; }
  .chip.on { background: var(--rasp); color: var(--white); border-color: var(--rasp); }
  .group { margin-top: 22px; }
  .label { font-size: 1rem; font-weight: 600; line-height: 1.4; }
  .row-label { font-size: 0.95rem; font-weight: 600; }
  .footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .footer-in { max-width: 460px; margin: 0 auto; padding: 12px 12px; display: flex; align-items: center; justify-content: space-between; }
  .footer-right { display: flex; align-items: center; gap: 2px; }
  .rev { margin-top: 24px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--white); }
  .rev-item { display: block; width: 100%; text-align: left; padding: 12px 16px; background: transparent; border: none; border-bottom: 1px solid var(--line); }
  .rev-item:last-child { border-bottom: none; }
  .rev-title { display: block; font-size: 0.9rem; font-weight: 600; color: var(--ink); }
  .rev-prev { display: block; font-size: 0.875rem; margin-top: 2px; color: var(--muted); }
  .rev-prev.skip { color: var(--rasp); }
  .card { margin-top: 24px; background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .sign { font-family: var(--serif); font-size: 1.05rem; line-height: 1.6; }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var KEY = "rana-intake-v2";
  var YNM = ["Yes", "Maybe", "No"];
  var MIC = true;

  var SCREENS = [
    { id: "keep", title: "The job itself",
      q: "What part of your job would you keep even if you switched careers tomorrow? And what part do you wish would just disappear?",
      hints: ["A recent day that actually felt good", "The tasks you'd do even if nobody paid you", "The ones that drain you"],
      blocks: [{ type: "voice", id: "keep" }] },

    { id: "quick", title: "Quick round",
      q: "Forget job titles for a second. Just tap what's true.",
      blocks: [
        { type: "chips", id: "pp", label: "People or paperwork?", options: ["People", "Paperwork", "A mix"] },
        { type: "chips", id: "rc", label: "Routine or chaos?", options: ["Routine", "Chaos", "A mix"] },
        { type: "chips", id: "tl", label: "Being told what to do, or left alone?", options: ["Told what to do", "Left alone", "A mix"] },
        { type: "chips", id: "oh", label: "Office, home, or a mix?", options: ["Office", "Home", "A mix"] },
        { type: "voice", id: "quick_extra", label: "Anything behind those answers? Totally optional.", short: true }
      ] },

    { id: "skills", title: "Skills you don't talk about",
      q: "What are you good at that never made it onto your resume?",
      hints: ["Any languages you speak besides English", "Things you're good at outside of work", "What your favourite coworker would say you're best at"],
      blocks: [
        { type: "voice", id: "skills" },
        { type: "chips", id: "lead", label: "Would you want to lead a team again, like you did in retail?", options: YNM }
      ] },

    { id: "industries", title: "Gut reactions",
      q: "Which of these sound interesting, and which sound awful?",
      blocks: [
        { type: "grid", id: "ind", rows: ["Insurance claims", "Disability case management", "Compliance at a bank", "Real estate closings", "A legal software company", "Running a law office"], options: ["Ooh", "Meh", "No thanks"] },
        { type: "voice", id: "stay_law", label: "And real talk: if the money were the same everywhere, would you stay in law? Say why or why not.", short: true }
      ] },

    { id: "matters", title: "What matters besides money",
      q: "Pick up to three that matter most to you.",
      blocks: [
        { type: "chips", id: "priorities", multi: true, max: 3, options: ["Fully remote", "Pension and benefits", "Shorter commute", "Less stress", "A bigger title", "Flexible hours", "Job security", "Learning something new"] },
        { type: "voice", id: "matters_extra", label: "Anything that's not on the list?", short: true }
      ] },

    { id: "deal", title: "Dealbreakers",
      q: "A few quick ones about what you would and wouldn't do.",
      blocks: [
        { type: "chips", id: "office_days", label: "How much time in an office could you do?", options: ["Fully remote only", "A few days a week", "Full time in office is fine"] },
        { type: "chips", id: "contract", label: "Would you take a contract role, not permanent?", options: YNM },
        { type: "chips", id: "title_step", label: "Would you take a legal assistant title if it paid more?", options: YNM },
        { type: "chips", id: "start", label: "How soon could you start somewhere new?", options: ["ASAP", "Within two months", "No rush"] },
        { type: "chips", id: "commute_how", label: "How do you get to work now?", options: ["Drive", "Transit", "Other"] },
        { type: "chips", id: "commute_time", label: "How long is your commute each way?", options: ["Under 30 min", "30 to 60 min", "Over an hour"] },
        { type: "voice", id: "auto_no", label: "Anything that's an automatic no?", short: true }
      ] },

    { id: "location", title: "Location",
      q: "When you think about working in the US, is it about living there, or is it about the money?",
      hints: ["No wrong answer here", "Talk about what the dream version actually looks like"],
      blocks: [
        { type: "voice", id: "states" },
        { type: "chips", id: "toronto", label: "Would you move to Toronto for the right job?", options: YNM }
      ] },

    { id: "money", title: "Money, honestly",
      q: "How are you actually doing month to month right now? Is this a fix it in three months thing, or a fix it now thing?",
      blocks: [
        { type: "voice", id: "money" },
        { type: "chips", id: "side_work", label: "Would you do some side work, like freelance legal or admin tasks, to bridge the gap for now?", options: YNM }
      ] },

    { id: "firm", title: "Your current firm",
      q: "What's it actually like at your firm right now?",
      hints: ["How your file load compares to the other clerks", "Whether you've ever asked for a raise", "What happened when anyone else asked"],
      blocks: [
        { type: "voice", id: "firm" },
        { type: "text", id: "hours", label: "Roughly how many hours a week do you actually work, including evenings?", placeholder: "e.g. 45ish" },
        { type: "chips", id: "drained", label: "By the end of the week, you feel...", options: ["Fine", "Tired", "Running on empty"] },
        { type: "voice", id: "stay_for", label: "If they paid you more, would you stay? How much would it take?", short: true }
      ] },

    { id: "board", title: "Where things are at",
      q: "Where do things stand with each of these? Tap whatever you remember.",
      blocks: [
        { type: "grid", id: "apps", rows: ["Intact", "Altis", "LRO Staffing", "ZSA", "City of Ottawa", "BLG", "Perley-Robertson", "Tierney Stauffer", "Merovitz Potechin", "Ruby & Co.", "The onboarding job"], options: ["Sent", "Heard back", "Not sent", "Unsure"] },
        { type: "voice", id: "own_apps", label: "Anything you applied to on your own, or a job you saw and actually loved?", short: true },
        { type: "chips", id: "work_knows", label: "Does anyone at work know you're looking?", options: ["Nobody", "One or two people", "Yes"] },
        { type: "chips", id: "linkedin", label: "Is your LinkedIn up to date?", options: ["Yes", "Sort of", "No"] }
      ] },

    { id: "interview", title: "The interview",
      q: "Tell me about that interview, like you're telling a friend. What did they ask you?",
      note: "You got the interview, which means the resume works. This just helps us tune the last step.",
      hints: ["Who it was with, and was it live or one of those record yourself video things", "Any moment that felt shaky", "Did salary come up"],
      blocks: [
        { type: "voice", id: "interview" },
        { type: "chips", id: "format", label: "Which feels easiest for you?", options: ["Phone", "Video", "In person"] },
        { type: "voice", id: "stock_answers", label: "How do you usually answer \"tell me about yourself\" and \"why are you leaving?\" Say it the way you would in an interview.", short: true }
      ] },

    { id: "p1", title: "The P1, French, and courses",
      q: "What actually happened with the P1? Did you write it, or just never get to it? Would you ever want another crack at it?",
      note: "Zero judgment either way. The plan just branches differently.",
      blocks: [
        { type: "voice", id: "p1" },
        { type: "chips", id: "french", label: "French?", options: ["Hard no", "Maybe someday", "I'd actually do it"] },
        { type: "chips", id: "course", label: "Would you take a short course or certificate if it led to more money?", options: ["Yes", "Depends how long", "No"] }
      ] },

    { id: "numbers", title: "Two numbers",
      q: "What salary would feel like actually winning? And what's the minimum where switching jobs is even worth the hassle?",
      blocks: [
        { type: "text", id: "win_num", label: "Feels like winning", placeholder: "$", numeric: true },
        { type: "text", id: "min_num", label: "Minimum where switching is even worth the hassle", placeholder: "$", numeric: true }
      ],
      foot: "Your numbers, not anyone else's. Gut feel is fine." },

    { id: "longgame", title: "The long game",
      q: "In five years, what would you want to be doing?",
      blocks: [
        { type: "chips", id: "five_years", options: ["Lawyer someday", "Senior clerk or paralegal", "Running an office or a team", "Something outside law", "No idea yet"] },
        { type: "voice", id: "five_years_more", label: "Say more about it, if anything comes to mind.", short: true }
      ] },

    { id: "vouch", title: "Who'd vouch for you",
      q: "Who are two or three people, outside your current firm, who'd say great things about your work?",
      hints: ["Old managers count, like from Nor-Can or Marciano", "Just names and how you know them for now"],
      blocks: [{ type: "voice", id: "vouch", short: true }] },

    { id: "liz", title: "Your resume and Liz",
      q: "Where are you at with getting your resume over to Liz to look at?",
      blocks: [
        { type: "chips", id: "liz_status", options: ["Already sent it", "Working on it", "Haven't started yet", "Remind me what the plan was"] },
        { type: "voice", id: "liz_notes", label: "Anything you want Liz to focus on, or anything you want to change about it?", short: true }
      ] },

    { id: "threemonths", title: "Three months from now",
      q: "If we're sitting here in three months and this whole thing worked, what changed? And what's the one thing you want us to chase first?",
      blocks: [{ type: "voice", id: "threemonths" }] },

    { id: "anything", title: "Anything else",
      q: "What's on your mind about all of this that I didn't ask?",
      blocks: [{ type: "voice", id: "anything" }] }
  ];

  var BLOCKS = {};
  SCREENS.forEach(function (sc) { sc.blocks.forEach(function (b) { BLOCKS[b.id] = b; }); });
  var HALF = Math.floor(SCREENS.length / 2) - 1;

  function freshState() { return { screen: "welcome", qIndex: 0, v: {}, skipped: {} }; }
  var s = freshState(), resumed = false, fromReview = false, copied = false;

  function blockHas(b) {
    if (b.type === "grid") return b.rows.some(function (r) { return !!s.v[b.id + ":" + r]; });
    var x = s.v[b.id];
    if (Array.isArray(x)) return x.length > 0;
    return !!(x || "").toString().trim();
  }
  function screenHas(sc) { return sc.blocks.some(blockHas); }

  try {
    var raw = window.localStorage.getItem(KEY);
    if (raw) {
      var saved = JSON.parse(raw);
      if (saved && saved.v) {
        s = { screen: "welcome", qIndex: saved.qIndex || 0, v: saved.v || {}, skipped: saved.skipped || {} };
        resumed = SCREENS.some(screenHas);
      }
    }
  } catch (e) {}

  var saveTimer = null;
  function save() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { try { window.localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }, 300);
  }

  function esc(t) {
    return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function words(t) { return (t || "").trim().split(/\s+/).filter(Boolean).length; }

  // ---------- BLOCK RENDERING ----------
  function renderBlock(b, first) {
    var h = '<div class="' + (first && !b.label ? "" : "group") + '">';
    if (b.label) h += '<p class="label">' + esc(b.label) + '</p>';

    if (b.type === "voice") {
      var val = s.v[b.id] || "";
      h += '<p class="small muted mt8">Tap the mic on your keyboard and just talk. Rambling is perfect.</p>' +
        '<textarea class="mt8' + (b.short ? " short" : "") + '" data-v="' + b.id + '" placeholder="Start talking..." aria-label="' + esc(b.label || "Your answer") + '">' + esc(val) + '</textarea>' +
        '<p class="small rasp mt8' + (words(val) >= 40 ? "" : " hidden") + '" data-keep="' + b.id + '">This is great. Keep going, or move on when you are ready.</p>';
    } else if (b.type === "text") {
      h += '<input class="mt8" data-v="' + b.id + '" ' + (b.numeric ? 'inputmode="numeric" ' : '') +
        'placeholder="' + esc(b.placeholder || "") + '" value="' + esc(s.v[b.id] || "") + '" aria-label="' + esc(b.label) + '">';
    } else if (b.type === "chips") {
      var cur = s.v[b.id];
      h += '<div class="chips">';
      b.options.forEach(function (o, i) {
        var on = b.multi ? (Array.isArray(cur) && cur.indexOf(o) > -1) : cur === o;
        h += '<button class="chip' + (on ? " on" : "") + '" data-chip="' + b.id + '" data-i="' + i + '" aria-pressed="' + on + '">' + esc(o) + '</button>';
      });
      h += '</div>';
      if (b.multi) {
        var n = Array.isArray(cur) ? cur.length : 0;
        h += '<p class="small muted mt8">' + n + ' of ' + b.max + ' picked. Tap again to unpick.</p>';
      }
    } else if (b.type === "grid") {
      b.rows.forEach(function (r, ri) {
        var cur2 = s.v[b.id + ":" + r];
        h += '<div class="group"><p class="row-label">' + esc(r) + '</p><div class="chips tight">';
        b.options.forEach(function (o, i) {
          var on2 = cur2 === o;
          h += '<button class="chip' + (on2 ? " on" : "") + '" data-grid="' + b.id + '" data-row="' + ri + '" data-i="' + i + '" aria-pressed="' + on2 + '">' + esc(o) + '</button>';
        });
        h += '</div></div>';
      });
    }
    return h + '</div>';
  }

  // ---------- SCREENS ----------
  function renderWelcome() {
    return '<div class="wrap welcome">' +
      '<h1 class="big">A few questions,<br>from Michael.</h1>' +
      '<div class="body-copy mt8">' +
        '<p>This takes about 20 to 25 minutes, and nobody sees it but me. There are no wrong answers, you can skip anything you want, and nothing gets sent until you press the last button yourself.</p>' +
        '<p>One favor: use the little mic on your keyboard and just <em>talk</em>. Long, rambly, honest answers are perfect. Don\'t fix typos. The more you say, the better the plan gets.</p>' +
        '<p class="muted">Your answers save automatically on this phone, so you can close this and come back any time.</p>' +
        (resumed ? '<p class="rasp strong">Welcome back. Your earlier answers are still here.</p>' : '') +
      '</div>' +
      '<div class="mt40"><button class="btn primary" data-act="start">' + (resumed ? "Pick up where I left off" : "Let's go") + '</button></div>' +
    '</div>';
  }

  function renderQuestion() {
    var sc = SCREENS[s.qIndex];
    var pct = ((s.qIndex + 1) / SCREENS.length) * 100;
    var h = '<div class="wrap">' +
      '<div class="bar"><div style="width:' + pct + '%"></div></div>' +
      '<p class="small muted mt12">' + (s.qIndex + 1) + ' of ' + SCREENS.length + ' &middot; ' + esc(sc.title) + '</p>';
    if (s.qIndex === HALF && !fromReview) h += '<p class="small rasp strong mt8">Halfway there. This is really helpful.</p>';
    h += '<h1 class="q">' + esc(sc.q) + '</h1>';
    if (sc.note) h += '<p class="small rasp mt12">' + esc(sc.note) + '</p>';
    if (sc.hints) h += '<p class="small muted mt12">Things you might talk about: ' + sc.hints.map(esc).join(" &middot; ") + '</p>';
    h += '<div class="mt20">';
    sc.blocks.forEach(function (b, i) { h += renderBlock(b, i === 0); });
    if (sc.foot) h += '<p class="small muted mt12">' + esc(sc.foot) + '</p>';
    h += '</div></div>';

    var nextLabel = fromReview ? "Save" : (s.qIndex === SCREENS.length - 1 ? "Review" : "Next");
    h += '<div class="footer"><div class="footer-in">' +
      '<button class="btn" data-act="back">Back</button>' +
      '<div class="footer-right"><button class="btn" data-act="skip">Skip for now</button>' +
      '<button class="btn primary" data-act="next">' + nextLabel + '</button></div></div></div>';
    return h;
  }

  function blockValueText(b) {
    if (b.type === "grid") return b.rows.map(function (r) { return s.v[b.id + ":" + r] ? r + ": " + s.v[b.id + ":" + r] : ""; }).filter(Boolean).join(", ");
    var x = s.v[b.id];
    if (Array.isArray(x)) return x.join(", ");
    return (x || "").toString().trim();
  }

  function renderReview() {
    var h = '<div class="wrap"><h1 class="mid">Read it back</h1>' +
      '<p class="muted mt8">Tap anything to change it. Skipped ones are fine to leave skipped.</p><div class="rev">';
    SCREENS.forEach(function (sc, i) {
      var skipped = s.skipped[sc.id] && !screenHas(sc);
      var pv = sc.blocks.map(blockValueText).filter(Boolean).join("  |  ");
      var txt = skipped ? "Skipped for now" : (pv ? (pv.length > 90 ? pv.slice(0, 90) + "..." : pv) : "Empty");
      h += '<button class="rev-item" data-jump="' + i + '"><span class="rev-title">' + (i + 1) + '. ' + esc(sc.title) + '</span>' +
        '<span class="rev-prev' + (skipped ? " skip" : "") + '">' + esc(txt) + '</span></button>';
    });
    return h + '</div><div class="mt32"><button class="btn primary" data-act="done">Looks good</button> ' +
      '<button class="btn" data-act="reviewback">Back</button></div></div>';
  }

  function compile() {
    var out = ["RANA'S ANSWERS  (" + new Date().toLocaleDateString() + ")", ""];
    SCREENS.forEach(function (sc, i) {
      out.push((i + 1) + ". " + sc.title.toUpperCase());
      if (s.skipped[sc.id] && !screenHas(sc)) { out.push("(skipped for now)"); out.push(""); return; }
      sc.blocks.forEach(function (b) {
        if (b.type === "grid") {
          b.rows.forEach(function (r) { out.push(r + ": " + (s.v[b.id + ":" + r] || "(no pick)")); });
        } else {
          var t = blockValueText(b) || (b.type === "voice" ? "(blank)" : "(no pick)");
          out.push(b.label ? b.label + " " + t : t);
        }
      });
      out.push("");
    });
    return out.join("\n");
  }

  function renderDone() {
    return '<div class="wrap welcome"><h1 class="mid">Last step</h1>' +
      '<p class="mt12" style="line-height:1.6">Press the button, then paste it into our text thread. That\'s the whole thing.</p>' +
      '<div class="mt32"><button class="btn primary" data-act="copy">Copy my answers</button></div>' +
      (copied === true ? '<div class="card"><p class="rasp strong">Copied.</p><p class="mt8" style="line-height:1.5">Now open Messages, find our thread, press and hold in the text box, and tap Paste. Done.</p></div>' : '') +
      (copied === "fail" ? '<div class="card"><p class="rasp strong">Your phone blocked the copy.</p><p class="mt8" style="line-height:1.5">Press and hold in the box below, tap Select All, then Copy, and paste it into our thread.</p><textarea class="mt12" readonly>' + esc(compile()) + '</textarea></div>' : '') +
      '<p class="sign mt40">Thank you for doing this. For real.<br>— Michael</p>' +
      '<div class="mt32"><button class="btn" data-act="toreview">Go back and read it again</button></div></div>';
  }

  var app = document.getElementById("app");
  function render() {
    var html = s.screen === "welcome" ? renderWelcome() : s.screen === "review" ? renderReview() : s.screen === "done" ? renderDone() : renderQuestion();
    app.innerHTML = html;
    window.scrollTo(0, 0);
  }
  function rerenderKeepScroll() {
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }

  // ---------- NAVIGATION ----------
  function goNext() {
    if (fromReview) { fromReview = false; s.screen = "review"; }
    else if (s.qIndex >= SCREENS.length - 1) s.screen = "review";
    else s.qIndex += 1;
    save(); render();
  }
  function goBack() {
    if (fromReview) { fromReview = false; s.screen = "review"; }
    else if (s.qIndex === 0) s.screen = "welcome";
    else s.qIndex -= 1;
    save(); render();
  }
  function skip() {
    var sc = SCREENS[s.qIndex];
    if (!screenHas(sc)) s.skipped[sc.id] = true;
    goNext();
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }
  function copyOut() {
    var text = compile();
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { copied = true; render(); },
        function () { copied = fallbackCopy(text) ? true : "fail"; render(); });
    } else { copied = fallbackCopy(text) ? true : "fail"; render(); }
  }

  // ---------- EVENTS ----------
  app.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;

    if (t.dataset.chip) {
      var b = BLOCKS[t.dataset.chip], opt = b.options[+t.dataset.i];
      if (b.multi) {
        var arr = Array.isArray(s.v[b.id]) ? s.v[b.id].slice() : [];
        var at = arr.indexOf(opt);
        if (at > -1) arr.splice(at, 1); else if (arr.length < b.max) arr.push(opt);
        s.v[b.id] = arr;
      } else {
        s.v[b.id] = s.v[b.id] === opt ? "" : opt;
      }
      save(); rerenderKeepScroll(); return;
    }
    if (t.dataset.grid) {
      var g = BLOCKS[t.dataset.grid], row = g.rows[+t.dataset.row], o2 = g.options[+t.dataset.i], k = g.id + ":" + row;
      s.v[k] = s.v[k] === o2 ? "" : o2;
      save(); rerenderKeepScroll(); return;
    }
    if (t.dataset.jump) {
      fromReview = true; s.screen = "questions"; s.qIndex = +t.dataset.jump;
      save(); render(); return;
    }
    var act = t.dataset.act;
    if (act === "start") { s.screen = "questions"; save(); render(); }
    else if (act === "next") goNext();
    else if (act === "back") goBack();
    else if (act === "skip") skip();
    else if (act === "done") { s.screen = "done"; copied = false; save(); render(); }
    else if (act === "reviewback") { s.screen = "questions"; s.qIndex = SCREENS.length - 1; save(); render(); }
    else if (act === "toreview") { s.screen = "review"; save(); render(); }
    else if (act === "copy") copyOut();
  });

  app.addEventListener("input", function (e) {
    var el = e.target;
    if (!el.dataset.v) return;
    s.v[el.dataset.v] = el.value;
    var hint = app.querySelector('[data-keep="' + el.dataset.v + '"]');
    if (hint) hint.classList.toggle("hidden", words(el.value) < 40);
    save();
  });

  window.addEventListener("pagehide", function () { try { window.localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} });

  render();
})();
</script>
</body>
</html>
